[package]
name = "expulsor"
version = "0.1.0"
edition = "2021"
authors = ["Expulsor Maintainers"]
description = "Expulsor - Network control tool rewritten in Rust"
license = "MIT"

[package.metadata]
documentation = "https://github.com/Daniel-Santiago-Acosta-1013/Expulsor"

[dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
indexmap = { version = "2", features = ["serde"] }
regex = "1"
once_cell = "1"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "signal"] }
ratatui = { version = "0.26", default-features = false, features = ["crossterm", "macros"] }
crossterm = "0.27"
color-eyre = "0.6"
reqwest = { version = "0.11", features = ["json", "gzip", "brotli", "deflate", "rustls-tls", "cookies"] }
url = "2"
sha2 = "0.10"
dirs = "5"
ipnetwork = "0.20"
get_if_addrs = "0.5"
default-net = "0.22"
byteorder = "1"
pnet = { version = "0.33", default-features = false }
pnet_datalink = { version = "0.33" }
pnet_packet = { version = "0.33" }
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
hex = "0.4"
rand = "0.8"
serde_bytes = "0.11"
async-stream = "0.3"
dns-lookup = "2"
quick-xml = { version = "0.36", features = ["serialize"] }
signal-hook = "0.3"
strum = { version = "0.25", features = ["derive"] }
strum_macros = "0.25"

[build-dependencies]
vergen = { version = "8", features = ["git", "build", "rustc"] }
